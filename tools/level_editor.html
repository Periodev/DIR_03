<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DIR3 Level Editor</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #171b22;
      --panel: #202631;
      --line: #3c4656;
      --text: #eef2f7;
      --muted: #aab5c5;
      --floor: #2c3440;
      --wall: #090b0f;
      --player: #3e9eff;
      --block: #dc8e38;
      --recovery: #ad57c2;
      --target: #59f2a2;
      --fence: #f1cd55;
      --focus: #f1cd55;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--text);
      font-family: Inter, "Segoe UI", sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { max-width: 1560px; margin: 0 auto; padding: 24px; }
    .topbar { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0; }
    .status { color: var(--muted); font-size: 14px; text-align: right; }
    .status.error { color: #ff9e9e; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
    .workspace, .sidebar { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
    .workspace { min-width: 0; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; padding: 16px; border-bottom: 1px solid var(--line); }
    .toolbar label { display: grid; gap: 5px; color: var(--muted); font-size: 12px; }
    input[type="number"], input[type="text"] {
      width: 70px; height: 34px; border: 1px solid var(--line); border-radius: 4px;
      background: #151a22; color: var(--text); padding: 5px 8px;
    }
    #block-label { width: 50px; text-align: center; text-transform: uppercase; }
    #block-label[data-kind="normal"] { border-color: var(--block); }
    #block-label[data-kind="recovery"] { border-color: var(--recovery); }
    .command, .tool {
      min-height: 34px; border: 1px solid var(--line); border-radius: 4px;
      background: #1a202a; color: var(--text); padding: 6px 10px;
    }
    .command:hover, .tool:hover { border-color: #6a7789; background: #27303d; }
    .command:focus-visible, .tool:focus-visible, .cell:focus-visible, .edge:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .tools { display: flex; flex: 1 1 420px; flex-wrap: wrap; min-width: 0; gap: 6px; margin-left: auto; justify-content: flex-end; }
    .tool { display: inline-flex; align-items: center; gap: 6px; padding-inline: 9px; }
    .tool[aria-pressed="true"] { border-color: var(--focus); color: var(--focus); background: #2e2a1c; }
    .swatch { width: 13px; height: 13px; display: inline-block; border-radius: 2px; border: 1px solid rgba(255,255,255,.22); }
    .swatch.wall { background: var(--wall); } .swatch.floor { background: var(--floor); }
    .swatch.target { background: var(--target); } .swatch.player { background: var(--player); }
    .swatch.block { background: var(--block); } .swatch.recovery { background: var(--recovery); }
    .swatch.clear { background: transparent; border-style: dashed; }
    .swatch.fence { background: var(--fence); height: 4px; border: 0; border-radius: 0; }
    .grid-scroller { overflow: auto; padding: 20px; min-height: 530px; }
    #grid { display: grid; width: max-content; }
    .cell-wrap { position: relative; width: 48px; height: 48px; }
    .cell {
      position: absolute; inset: 2px; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 0;
      background: var(--floor); color: transparent; padding: 0;
    }
    .cell.wall { background: var(--wall); }
    .cell.target::before { content: "*"; color: var(--target); position: absolute; inset: 0; display: grid; place-items: center; font: 700 26px/1 ui-monospace, monospace; }
    .cell.block::after { content: attr(data-label); position: absolute; inset: 5px; display: grid; place-items: center; background: var(--block); color: #1e160d; font: 700 17px/1 ui-monospace, monospace; }
    .cell.block.recovery::after { background: var(--recovery); color: #fff; }
    .cell.block.target::after { box-shadow: 0 0 0 3px var(--target); }
    .cell.player::after { content: "@"; position: absolute; inset: 8px; display: grid; place-items: center; border-radius: 50%; background: var(--player); color: #081321; font: 700 18px/1 ui-monospace, monospace; }
    .cell.player.target::after { box-shadow: 0 0 0 3px var(--target); }
    .edge {
      position: absolute; z-index: 2; border: 0; border-radius: 0; padding: 0; background: transparent;
      pointer-events: none;
    }
    #grid[data-tool="fence"] .edge { pointer-events: auto; }
    #grid[data-tool="fence"] .edge:hover { background: color-mix(in srgb, var(--fence) 35%, transparent); }
    .edge.vertical { top: 2px; right: -2px; width: 8px; height: 44px; }
    .edge.horizontal { bottom: -2px; left: 2px; width: 44px; height: 8px; }
    .edge.fence::after { content: ""; position: absolute; background: var(--fence); box-shadow: 0 0 0 1px #624f17; }
    .edge.vertical.fence::after { inset: 0 2px; }
    .edge.horizontal.fence::after { inset: 2px 0; }
    .sidebar { overflow: hidden; }
    .section { padding: 16px; }
    .section + .section { border-top: 1px solid var(--line); }
    h2 { margin: 0 0 10px; font-size: 14px; font-weight: 700; letter-spacing: 0; }
    .section-note { margin: -4px 0 10px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    textarea { width: 100%; min-height: 310px; resize: vertical; border: 1px solid var(--line); border-radius: 4px; background: #11161d; color: #e5edf8; padding: 12px; font: 14px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .output-actions { display: flex; gap: 8px; margin-top: 10px; }
    .output-actions .command { flex: 1; }
    .legend { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; margin: 0; color: var(--muted); font-size: 13px; }
    .legend dt { margin: 0; color: var(--text); font-family: ui-monospace, monospace; }
    .legend dd { margin: 0; }
    @media (max-width: 900px) {
      .app { padding: 14px; }
      .layout { grid-template-columns: 1fr; }
      .sidebar { order: -1; }
      .toolbar { align-items: start; }
      .tools { width: 100%; margin-left: 0; justify-content: flex-start; }
      .grid-scroller { min-height: 380px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>DIR3 Level Editor</h1>
      <div id="status" class="status" aria-live="polite"></div>
    </header>
    <div class="layout">
      <section class="workspace" aria-label="關卡網格">
        <div class="toolbar">
          <label>寬<input id="width" type="number" min="3" max="40" value="9"></label>
          <label>高<input id="height" type="number" min="3" max="30" value="8"></label>
          <button id="resize" class="command" type="button">調整網格</button>
          <button id="load-fence-demo" class="command" type="button">柵欄範例</button>
          <button id="clear-all" class="command" type="button" title="清空格子與柵欄">全清空</button>
          <button id="clear-fences" class="command" type="button" title="移除所有柵欄">清空柵欄</button>
          <label>方塊代號<input id="block-label" type="text" maxlength="1" value="A" data-kind="normal" aria-label="方塊代號" title="普通塊代號 A-Q"></label>
          <div class="tools" role="toolbar" aria-label="繪製工具">
            <button class="tool" type="button" data-tool="wall" title="牆"><span class="swatch wall"></span>牆</button>
            <button class="tool" type="button" data-tool="floor" title="地板"><span class="swatch floor"></span>地板</button>
            <button class="tool" type="button" data-tool="target" title="目標"><span class="swatch target"></span>目標</button>
            <button class="tool" type="button" data-tool="player" title="玩家"><span class="swatch player"></span>玩家</button>
            <button class="tool" type="button" data-tool="block" title="配置普通塊（A-Q）"><span class="swatch block"></span>普通塊</button>
            <button class="tool" type="button" data-tool="recovery-block" title="配置回收塊（R-Z）"><span class="swatch recovery"></span>回收塊</button>
            <button class="tool" type="button" data-tool="clear" title="清空此格"><span class="swatch clear"></span>清空</button>
            <button class="tool" type="button" data-tool="fence" title="切換柵欄邊"><span class="swatch fence"></span>柵欄</button>
          </div>
        </div>
        <div class="grid-scroller"><div id="grid" role="grid" aria-label="關卡與柵欄編輯網格"></div></div>
      </section>
      <aside class="sidebar">
        <section class="section">
          <h2>LEVEL DATA</h2>
          <p class="section-note">Cell layer 與 edge layer 以 runtime 相同的雙邊矩陣輸出。</p>
          <textarea id="ascii-output" spellcheck="false" aria-label="LEVEL DATA"></textarea>
          <div class="output-actions">
            <button id="apply-ascii" class="command" type="button">套用資料</button>
            <button id="copy-ascii" class="command" type="button">複製資料</button>
          </div>
        </section>
        <section class="section">
          <dl class="legend">
            <dt>#</dt><dd>牆</dd><dt>.</dt><dd>地板與開放邊</dd><dt>*</dt><dd>空目標</dd>
            <dt>@</dt><dd>玩家</dd><dt>+</dt><dd>玩家在目標</dd><dt>A-Q</dt><dd>普通塊</dd><dt>R-Z</dt><dd>回收塊</dd>
            <dt>a-q</dt><dd>普通塊在目標</dd><dt>r-z</dt><dd>回收塊在目標</dd>
            <dt>-</dt><dd>水平柵欄</dd><dt>|</dt><dd>垂直柵欄</dd>
          </dl>
        </section>
      </aside>
    </div>
  </main>
  <script>
    "use strict";

    const initialMap = `#########
#.......#
#.....B.#
#@.#....#
#..A..*.#
#.C..#..#
#.......#
#########`;
    const fenceDemo = `!cell-edge-v1

[cells]
AB.C*
@D..#
#####

[horizontal_edges]
---..
.....

[vertical_edges]
....
....
....`;
    const gridElement = document.querySelector("#grid");
    const outputElement = document.querySelector("#ascii-output");
    const statusElement = document.querySelector("#status");
    const widthInput = document.querySelector("#width");
    const heightInput = document.querySelector("#height");
    const blockLabelInput = document.querySelector("#block-label");
    const blockToolRanges = {
      block: { first: "A", last: "Q" },
      "recovery-block": { first: "R", last: "Z" },
    };
    const lastBlockLabels = { block: "A", "recovery-block": "R" };
    let selectedTool = "wall";
    let cells = [];
    let horizontalEdges = [];
    let verticalEdges = [];

    function createCell() { return { wall: false, target: false, player: false, block: "" }; }
    function createEdgeLayers(width, height) {
      horizontalEdges = Array.from({ length: Math.max(0, height - 1) }, () => Array(width).fill(false));
      verticalEdges = Array.from({ length: height }, () => Array(Math.max(0, width - 1)).fill(false));
    }
    function setStatus(message, isError = false) {
      statusElement.textContent = message;
      statusElement.classList.toggle("error", isError);
    }
    function dimensions() { return { width: cells[0]?.length || 0, height: cells.length }; }
    function normalizeBlockLabel() {
      const range = blockToolRanges[selectedTool];
      let label = blockLabelInput.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 1);
      if (!label || (range && (label < range.first || label > range.last))) label = range?.first || "A";
      blockLabelInput.value = label;
      blockLabelInput.dataset.kind = isRecoveryLabel(label) ? "recovery" : "normal";
      blockLabelInput.title = isRecoveryLabel(label) ? "回收塊代號 R-Z" : "普通塊代號 A-Q";
      if (range) lastBlockLabels[selectedTool] = label;
      return blockLabelInput.value;
    }
    function isRecoveryLabel(label) { return label >= "R" && label <= "Z"; }
    function clearPlayer() { cells.flat().forEach(cell => { cell.player = false; }); }
    function removeBlockLabel(label) { cells.flat().forEach(cell => { if (cell.block === label) cell.block = ""; }); }
    function encodeCell(cell) {
      if (cell.wall) return "#";
      if (cell.player) return cell.target ? "+" : "@";
      if (cell.block) return cell.target ? cell.block.toLowerCase() : cell.block;
      return cell.target ? "*" : ".";
    }
    function generateCells() { return cells.map(row => row.map(encodeCell).join("")); }
    function generateLevelData() {
      const cellRows = generateCells();
      const horizontalRows = horizontalEdges.map(row => row.map(edge => edge ? "-" : ".").join(""));
      const verticalRows = verticalEdges.map(row => row.map(edge => edge ? "|" : ".").join(""));
      return [
        "!cell-edge-v1",
        "",
        "[cells]",
        ...cellRows,
        "",
        "[horizontal_edges]",
        ...horizontalRows,
        "",
        "[vertical_edges]",
        ...verticalRows,
      ].join("\n");
    }
    function fenceCount() {
      return horizontalEdges.flat().filter(Boolean).length + verticalEdges.flat().filter(Boolean).length;
    }
    function normalizeEdgesForWalls() {
      const { width, height } = dimensions();
      for (let y = 0; y < height; y += 1) for (let x = 0; x < width - 1; x += 1) {
        if (cells[y][x].wall || cells[y][x + 1].wall) verticalEdges[y][x] = false;
      }
      for (let y = 0; y < height - 1; y += 1) for (let x = 0; x < width; x += 1) {
        if (cells[y][x].wall || cells[y + 1][x].wall) horizontalEdges[y][x] = false;
      }
    }
    function syncOutput() {
      outputElement.value = generateLevelData();
      const playerCount = cells.flat().filter(cell => cell.player).length;
      const blockCount = cells.flat().filter(cell => cell.block).length;
      const recoveryCount = cells.flat().filter(cell => isRecoveryLabel(cell.block)).length;
      const targetCount = cells.flat().filter(cell => cell.target).length;
      const { width, height } = dimensions();
      const recoverySummary = recoveryCount ? `（${recoveryCount} 回收）` : "";
      const summary = `${width} × ${height}，${blockCount} 塊${recoverySummary}，${targetCount} 目標，${fenceCount()} 柵欄`;
      setStatus(playerCount === 1 ? `${summary}，可用關卡` : `${summary}，需放置一名玩家`, playerCount !== 1);
    }
    function edgeLabel(orientation, x, y) {
      const direction = orientation === "horizontal" ? "水平" : "垂直";
      return `${direction}邊 (${x}, ${y})`;
    }
    function addEdge(wrapper, orientation, x, y, fenced) {
      const edge = document.createElement("button");
      edge.type = "button";
      edge.className = `edge ${orientation}${fenced ? " fence" : ""}`;
      edge.setAttribute("aria-label", edgeLabel(orientation, x, y));
      edge.title = `${edgeLabel(orientation, x, y)}：${fenced ? "移除柵欄" : "建立柵欄"}`;
      edge.addEventListener("click", () => editEdge(orientation, x, y));
      wrapper.append(edge);
    }
    function renderGrid() {
      const { width, height } = dimensions();
      gridElement.innerHTML = "";
      gridElement.dataset.tool = selectedTool;
      gridElement.style.gridTemplateColumns = `repeat(${width}, 48px)`;
      cells.forEach((row, y) => row.forEach((cell, x) => {
        const wrapper = document.createElement("div");
        wrapper.className = "cell-wrap";
        const button = document.createElement("button");
        button.type = "button";
        button.className = `cell${cell.wall ? " wall" : ""}${cell.target ? " target" : ""}${cell.player ? " player" : ""}${cell.block ? " block" : ""}${isRecoveryLabel(cell.block) ? " recovery" : ""}`;
        button.dataset.label = cell.block;
        button.setAttribute("role", "gridcell");
        button.setAttribute("aria-label", `(${x}, ${y}) ${encodeCell(cell)}`);
        button.addEventListener("click", () => editCell(x, y));
        wrapper.append(button);
        if (x < width - 1) addEdge(wrapper, "vertical", x, y, verticalEdges[y][x]);
        if (y < height - 1) addEdge(wrapper, "horizontal", x, y, horizontalEdges[y][x]);
        gridElement.append(wrapper);
      }));
      syncOutput();
    }
    function editCell(x, y) {
      if (selectedTool === "fence") return;
      const cell = cells[y][x];
      if (selectedTool === "wall") Object.assign(cell, { wall: true, target: false, player: false, block: "" });
      else if (selectedTool === "floor") cell.wall = false;
      else if (selectedTool === "target") { cell.wall = false; cell.target = !cell.target; }
      else if (selectedTool === "player") { clearPlayer(); cell.wall = false; cell.block = ""; cell.player = true; }
      else if (blockToolRanges[selectedTool]) {
        const label = normalizeBlockLabel();
        removeBlockLabel(label); cell.wall = false; cell.player = false; cell.block = label;
      }
      else if (selectedTool === "clear") Object.assign(cell, createCell());
      normalizeEdgesForWalls();
      renderGrid();
    }
    function editEdge(orientation, x, y) {
      if (selectedTool !== "fence") return;
      const first = cells[y][x];
      const second = orientation === "horizontal" ? cells[y + 1][x] : cells[y][x + 1];
      if (first.wall || second.wall) return setStatus("柵欄只能位於兩個非牆格之間", true);
      if (orientation === "horizontal") horizontalEdges[y][x] = !horizontalEdges[y][x];
      else verticalEdges[y][x] = !verticalEdges[y][x];
      renderGrid();
    }
    function setTool(tool) {
      if (blockToolRanges[selectedTool]) normalizeBlockLabel();
      selectedTool = tool;
      document.querySelectorAll("[data-tool]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.tool === tool)));
      gridElement.dataset.tool = tool;
      if (blockToolRanges[tool]) {
        blockLabelInput.value = lastBlockLabels[tool];
        normalizeBlockLabel();
      }
    }
    function resizeGrid() {
      const width = Math.max(3, Math.min(40, Number(widthInput.value) || 9));
      const height = Math.max(3, Math.min(30, Number(heightInput.value) || 8));
      const oldCells = cells;
      const oldHorizontal = horizontalEdges;
      const oldVertical = verticalEdges;
      cells = Array.from({ length: height }, (_, y) => Array.from({ length: width }, (_, x) => oldCells[y]?.[x] || createCell()));
      createEdgeLayers(width, height);
      horizontalEdges.forEach((row, y) => row.forEach((_, x) => { horizontalEdges[y][x] = oldHorizontal[y]?.[x] || false; }));
      verticalEdges.forEach((row, y) => row.forEach((_, x) => { verticalEdges[y][x] = oldVertical[y]?.[x] || false; }));
      widthInput.value = width;
      heightInput.value = height;
      normalizeEdgesForWalls();
      renderGrid();
    }
    function clearAll() {
      const { width, height } = dimensions();
      cells = Array.from({ length: height }, () => Array.from({ length: width }, createCell));
      createEdgeLayers(width, height);
      renderGrid();
    }
    function clearFences() {
      const { width, height } = dimensions();
      createEdgeLayers(width, height);
      renderGrid();
    }
    function parseCells(cellRows) {
      if (!cellRows.length || !cellRows[0]) throw new Error("[cells] 不可為空");
      const width = cellRows[0].length;
      if (!cellRows.every(row => row.length === width)) throw new Error("[cells] 每列寬度必須相同");
      if (width < 3 || width > 40 || cellRows.length < 3 || cellRows.length > 30) throw new Error("尺寸需介於 3×3 與 40×30");
      const next = Array.from({ length: cellRows.length }, () => Array.from({ length: width }, createCell));
      const labels = new Set();
      let playerCount = 0;
      for (let y = 0; y < cellRows.length; y += 1) for (let x = 0; x < width; x += 1) {
        const symbol = cellRows[y][x];
        const cell = next[y][x];
        if (symbol === "#") cell.wall = true;
        else if (symbol === "*") cell.target = true;
        else if (symbol === "@" || symbol === "+") { cell.player = true; cell.target = symbol === "+"; playerCount += 1; }
        else if (/^[A-Z]$/.test(symbol) || /^[a-z]$/.test(symbol)) {
          const label = symbol.toUpperCase();
          if (labels.has(label)) throw new Error(`方塊代號 ${label} 重複`);
          labels.add(label); cell.block = label; cell.target = symbol === symbol.toLowerCase();
        } else if (symbol !== ".") throw new Error(`不支援符號：${symbol}`);
      }
      if (playerCount !== 1) throw new Error("[cells] 需剛好一名玩家");
      return next;
    }
    function readSection(lines, name) {
      const marker = `[${name}]`;
      const start = lines.indexOf(marker);
      if (start === -1) throw new Error(`缺少 ${marker}`);
      const rows = [];
      for (let index = start + 1; index < lines.length && !lines[index].startsWith("["); index += 1) {
        if (lines[index] !== "") rows.push(lines[index]);
      }
      return rows;
    }
    function parseEdgeRows(rows, expectedRows, expectedWidth, fenceSymbol, name) {
      if (rows.length !== expectedRows) throw new Error(`${name} 列數錯誤`);
      return rows.map((row, y) => {
        if (row.length !== expectedWidth) throw new Error(`${name} 第 ${y + 1} 列寬度錯誤`);
        return Array.from(row, symbol => {
          if (symbol === ".") return false;
          if (symbol === fenceSymbol) return true;
          throw new Error(`${name} 只接受 . 與 ${fenceSymbol}`);
        });
      });
    }
    function applyLevelData() {
      try {
        const lines = outputElement.value.replace(/\r/g, "").split("\n");
        const content = lines.filter(line => line !== "");
        if (!content.length) throw new Error("關卡資料不可為空");
        let nextCells;
        let nextHorizontal;
        let nextVertical;
        if (content[0] === "!cell-edge-v1") {
          const cellRows = readSection(content, "cells");
          nextCells = parseCells(cellRows);
          const width = nextCells[0].length;
          const height = nextCells.length;
          nextHorizontal = parseEdgeRows(readSection(content, "horizontal_edges"), Math.max(0, height - 1), width, "-", "[horizontal_edges]");
          nextVertical = parseEdgeRows(readSection(content, "vertical_edges"), height, Math.max(0, width - 1), "|", "[vertical_edges]");
        } else {
          nextCells = parseCells(content);
          const width = nextCells[0].length;
          const height = nextCells.length;
          nextHorizontal = Array.from({ length: Math.max(0, height - 1) }, () => Array(width).fill(false));
          nextVertical = Array.from({ length: height }, () => Array(Math.max(0, width - 1)).fill(false));
        }
        cells = nextCells;
        horizontalEdges = nextHorizontal;
        verticalEdges = nextVertical;
        normalizeEdgesForWalls();
        widthInput.value = cells[0].length;
        heightInput.value = cells.length;
        renderGrid();
      } catch (error) {
        setStatus(error.message, true);
      }
    }
    async function copyLevelData() {
      outputElement.select();
      try { await navigator.clipboard.writeText(outputElement.value); setStatus("關卡資料已複製"); }
      catch (_) { document.execCommand("copy"); setStatus("關卡資料已選取，可直接複製"); }
    }
    document.querySelectorAll("[data-tool]").forEach(button => button.addEventListener("click", () => setTool(button.dataset.tool)));
    document.querySelector("#resize").addEventListener("click", resizeGrid);
    document.querySelector("#load-fence-demo").addEventListener("click", () => { outputElement.value = fenceDemo; applyLevelData(); });
    document.querySelector("#clear-all").addEventListener("click", clearAll);
    document.querySelector("#clear-fences").addEventListener("click", clearFences);
    document.querySelector("#apply-ascii").addEventListener("click", applyLevelData);
    document.querySelector("#copy-ascii").addEventListener("click", copyLevelData);
    blockLabelInput.addEventListener("input", normalizeBlockLabel);
    outputElement.value = initialMap;
    applyLevelData();
    setTool("wall");
  </script>
</body>
</html>
